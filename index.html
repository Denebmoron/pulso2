<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulsoximetría Mark II</title>
    <style>
        :root {
            --bg-color: #05051a;
            --cyan: #00e5ff;
            --card-bg: #1a1a2e;
            --text-white: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 { font-size: 1.2rem; margin: 0; }
        .lang-select {
            background: #222; color: white; border: none; 
            padding: 5px 10px; border-radius: 5px;
        }
        .btn-cyan {
            background-color: var(--cyan);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: fit-content;
            align-self: flex-start;
            margin-bottom: 30px;
        }
        .btn-cyan:active { transform: scale(0.95); }
        .btn-cyan:disabled { opacity: .5; cursor: not-allowed; }
        .main-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }

        /* Disparador del modo demo: un puntito casi invisible, no un botón llamativo */
        .demo-trigger {
            position: fixed;
            bottom: 14px; right: 14px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,.08);
            border: none; padding: 0; cursor: pointer;
            transition: background .2s ease, transform .2s ease;
        }
        .demo-trigger:hover { background: rgba(0,229,255,.35); transform: scale(1.4); }
        .demo-trigger.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
        
        /* Círculo SpO2: anillo real que refleja el valor (antes era un adorno fijo) */
        .spo2-circle {
            --pct: 0; /* 0-100, lo actualiza JS cuando llega una lectura real */
            width: 150px; height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--cyan) calc(var(--pct) * 1%), rgba(255,255,255,.12) 0);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px;
            transition: background .6s ease;
        }
        .spo2-circle-inner {
            width: 128px; height: 128px;
            border-radius: 50%;
            background: var(--bg-color);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: bold;
            text-align: center;
        }

        /* Tarjeta BPM */
        .bpm-card {
            background-color: var(--card-bg);
            width: 100%; padding: 20px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            gap: 15px; margin-bottom: 20px;
            box-sizing: border-box;
        }
        .heart-icon { color: red; font-size: 2rem; }
        .bpm-value { font-size: 1.5rem; font-weight: bold; }

        .btn-center { align-self: center; margin-bottom: 30px; }
        
        /* Gráfica */
        .chart-section { width: 100%; text-align: left; }
        .chart-section h3 { font-size: 1rem; margin-bottom: 10px; }
        canvas {
            width: 100%; height: 120px;
            background-color: var(--card-bg);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h1 id="title">Revisa tu pulsoximetría</h1>
            <select class="lang-select" id="langSelect" aria-label="Idioma">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>

        <button class="btn-cyan" id="btnConnect">Conectar</button>

        <div class="spo2-circle">
            <div class="spo2-circle-inner">
                <span id="spo2Value">-- % SpO2</span>
            </div>
        </div>

        <div class="bpm-card">
            <div class="heart-icon">❤️</div>
            <div class="bpm-value"><span id="bpmValue">0</span> Bpm</div>
        </div>

        <button class="btn-cyan btn-center" id="btnHistory">Ver registro</button>

        <div class="chart-section">
            <h3 id="chartTitle">Curva pletismográfica de la señal</h3>
            <canvas id="plethCanvas" width="400" height="120"></canvas>
        </div>
    </div>

    <!-- Disparador del modo demo: un punto discreto, no un botón visible -->
    <button class="demo-trigger" id="btnDemo" title="Demo" aria-label="Demo"></button>

    <script>
        const btnConnect = document.getElementById('btnConnect');
        const bpmDisplay = document.getElementById('bpmValue');
        const spo2Display = document.getElementById('spo2Value');
        const spo2Circle = document.querySelector('.spo2-circle');
        const canvas = document.getElementById('plethCanvas');
        const ctx = canvas.getContext('2d');
        const titleEl = document.getElementById('title');
        const langSelect = document.getElementById('langSelect');
        const btnHistory = document.getElementById('btnHistory');
        const chartTitle = document.getElementById('chartTitle');
        const btnDemo = document.getElementById('btnDemo');

        // ---------- Idioma ----------
        const I18N = {
            es: { title: 'Revisa tu pulsoximetría', connect: 'Conectar', connecting: 'Buscando traje...', connected: 'Conectado', error: 'Error (Reintentar)', history: 'Ver registro', chart: 'Curva pletismográfica de la señal', startDemo: 'Modo demo', stopDemo: 'Detener demo' },
            en: { title: 'Check your pulse oximetry', connect: 'Connect', connecting: 'Searching device...', connected: 'Connected', error: 'Error (Retry)', history: 'View log', chart: 'Pulse waveform', startDemo: 'Demo mode', stopDemo: 'Stop demo' }
        };
        let lang = 'es';
        let connState = 'idle'; // idle | connecting | connected | error
        const t = k => I18N[lang][k];

        function renderBtn() {
            btnConnect.innerText = t(connState === 'idle' ? 'connect' : connState === 'connecting' ? 'connecting' : connState === 'connected' ? 'connected' : 'error');
            btnConnect.style.backgroundColor = connState === 'connected' ? '#00FF00' : '';
        }
        function renderDemoBtn() {
            btnDemo.classList.toggle('active', demoOn);
            btnDemo.title = t(demoOn ? 'stopDemo' : 'startDemo');
            btnDemo.setAttribute('aria-label', btnDemo.title);
        }
        function applyLang() {
            titleEl.innerText = t('title');
            btnHistory.innerText = t('history');
            chartTitle.innerText = t('chart');
            renderBtn();
            renderDemoBtn();
        }
        langSelect.addEventListener('change', e => {
            lang = e.target.value;
            document.documentElement.lang = lang;
            applyLang();
        });

        // UUIDs definidos en el código C++ de la ESP32-S3
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        // Variables para la gráfica
        let xPos = 0;
        let lastY = canvas.height / 2;

        btnConnect.addEventListener('click', async () => {
            try {
                connState = 'connecting';
                renderBtn();
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'MarkII_PPG' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);

                await characteristic.startNotifications();
                connState = 'connected';
                renderBtn();

                characteristic.addEventListener('characteristicvaluechanged', handleData);
            } catch (error) {
                console.error("Fallo de conexión:", error);
                connState = 'error';
                renderBtn();
            }
        });

        function applyReading(bpm, irValue, spo2) {
            // Actualizar BPM en pantalla
            if (bpm > 0) bpmDisplay.innerText = bpm;

            // Actualizar SpO2 solo si llegó un valor real (antes quedaba fijo en 90%)
            if (Number.isFinite(spo2) && spo2 > 0) {
                const pct = Math.min(100, Math.max(0, spo2));
                spo2Display.innerText = Math.round(spo2) + ' % SpO2';
                spo2Circle.style.setProperty('--pct', pct);
            }

            // Dibujar gráfica tipo osciloscopio
            drawGraph(irValue);
        }

        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            // Formato de la ESP32: "BPM,IR" siempre, y "BPM,IR,SPO2" si el firmware ya calcula SpO2
            const dataParts = value.split(',');

            if (dataParts.length >= 2) {
                const bpm = parseInt(dataParts[0]);
                const irValue = parseInt(dataParts[1]);
                const spo2 = dataParts.length >= 3 ? parseFloat(dataParts[2]) : NaN;
                applyReading(bpm, irValue, spo2);
            }
        }

        // ---------- Modo demo: simula lecturas para presentar la app sin el ESP32 conectado ----------
        let demoOn = false;
        let demoTimer = null;
        let demoPhase = 0;
        let demoBpm = 75;
        let demoSpo2 = 97;

        function demoShape(p) { // pico sistólico + muesca dicrota: forma típica de una onda de pulso real
            return Math.exp(-(((p - .18) / .08) ** 2)) + .35 * Math.exp(-(((p - .45) / .1) ** 2));
        }
        function demoTick() {
            demoPhase = (demoPhase + demoBpm / 1800) % 1; // ~30 pasos/seg de reloj del demo
            const ir = Math.round(demoShape(demoPhase) * 750 + 150);

            // Pequeñas variaciones aleatorias para que no se vea una línea perfectamente plana
            if (Math.random() < 0.02) demoBpm = Math.min(90, Math.max(65, demoBpm + (Math.random() * 4 - 2)));
            if (Math.random() < 0.02) demoSpo2 = Math.min(99, Math.max(95, demoSpo2 + (Math.random() * 2 - 1)));

            applyReading(Math.round(demoBpm), ir, demoSpo2);
        }
        function startDemo() {
            demoOn = true;
            demoTimer = setInterval(demoTick, 33); // ~30 Hz, ritmo similar al de notificaciones BLE reales
            btnConnect.disabled = true;
            renderDemoBtn();
        }
        function stopDemo() {
            demoOn = false;
            clearInterval(demoTimer);
            btnConnect.disabled = false;
            renderDemoBtn();
        }
        btnDemo.addEventListener('click', () => demoOn ? stopDemo() : startDemo());

        function drawGraph(irValue) {
            // Mapear el valor IR para que encaje en el canvas (ajustar según el ruido del sensor)
            // Se asume un delta simulado para el efecto visual, ya que el IR crudo es muy alto
            let mappedY = mapValue(irValue % 1000, 0, 1000, canvas.height, 0); 
            
            ctx.beginPath();
            ctx.moveTo(xPos - 2, lastY);
            ctx.lineTo(xPos, mappedY);
            ctx.strokeStyle = '#00e5ff'; // Cyan neón
            ctx.lineWidth = 2;
            ctx.stroke();

            lastY = mappedY;
            xPos += 2;

            // Borrar pantalla al llegar al borde derecho
            if (xPos >= canvas.width) {
                xPos = 0;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        // Función auxiliar para mapear rangos
        function mapValue(x, in_min, in_max, out_min, out_max) {
            return (x - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
        }

        applyLang(); // Aplica el idioma por defecto (es) al cargar
    </script>
</body>
</html>
